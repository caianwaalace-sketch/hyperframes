<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0410; }
      #root { position: absolute; inset: 0; font-family: "Oswald", sans-serif; }
      #bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, #1d3a5f 0%, #121a3a 45%, #05030a 100%); }
      .orb { position: absolute; border-radius: 50%; filter: blur(2px); opacity: 0; }
      #title-wrap { position: absolute; left: 0; width: 1080px; top: 760px; text-align: center; }
      #title { font-size: 104px; font-weight: 700; color: #ffcf5e; text-shadow: 0 0 60px #ff8a3d; letter-spacing: 0.02em; opacity: 0; padding: 0 40px; }
      #artist { margin-top: 26px; font-family: "Space Mono", monospace; font-size: 32px; color: #9fd1ff; letter-spacing: 0.18em; opacity: 0; }
      .line { position: absolute; left: 60px; width: 960px; text-align: center; font-weight: 700; opacity: 0; line-height: 1.15; }
      .en { top: 680px; font-size: 56px; color: #fff; }
      .pt { top: 900px; font-size: 44px; color: #ffcf5e; }
      #cta { position: absolute; left: 0; width: 1080px; top: 1600px; text-align: center; font-size: 46px; font-weight: 700; color: #fff; opacity: 0; }
      #cta b { color: #ffcf5e; }
      #tag { position: absolute; left: 0; width: 1080px; top: 170px; text-align: center; font-family: "Space Mono", monospace; font-size: 30px; letter-spacing: 0.25em; color: #9fd1ff; opacity: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg"></div>
      <div id="orbs"></div>
      <div id="tag" class="clip" data-start="0.3" data-duration="19">TRADUÇÃO · MÚSICA DO MOMENTO</div>
      <div id="title-wrap">
        <div id="title" class="clip" data-start="0.5" data-duration="4.3">FLOWER IN A HURRICANE</div>
        <div id="artist" class="clip" data-start="0.9" data-duration="3.9">JUSTICE · SZA · TAME IMPALA</div>
      </div>

      <div id="en1" class="line en clip" data-start="4.8" data-duration="5.2">A love that won't bend to the storm.</div>
      <div id="pt1" class="line pt clip" data-start="5.3" data-duration="4.7">Um amor que não se dobra à tempestade.</div>

      <div id="en2" class="line en clip" data-start="10.2" data-duration="5.3">Everything's falling, but I'm holding on to you.</div>
      <div id="pt2" class="line pt clip" data-start="10.7" data-duration="4.8">Tudo caindo ao redor, mas eu seguro firme em você.</div>

      <div id="cta" class="clip" data-start="15.8" data-duration="4.2">Segue pra mais <b>traduções</b> 🎶</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // orbs de partículas douradas/roxas
      let seed = 7;
      const rnd = () => {
        seed = (seed * 16807) % 2147483647;
        return seed / 2147483647;
      };
      const orbsEl = document.getElementById("orbs");
      const colors = ["#9fd1ff", "#5b6fb8", "#ff8a3d"];
      for (let i = 0; i < 26; i++) {
        const d = document.createElement("div");
        d.className = "orb";
        const size = 20 + rnd() * 90;
        Object.assign(d.style, {
          left: rnd() * 1080 + "px",
          top: rnd() * 1920 + "px",
          width: size + "px",
          height: size + "px",
          background: colors[i % colors.length],
        });
        orbsEl.appendChild(d);
        const op = 0.08 + rnd() * 0.22;
        tl.fromTo(d, { opacity: 0, y: 40 }, { opacity: op, y: -40, duration: 20, ease: "none" }, 0);
      }

      tl.fromTo("#bg", { scale: 1 }, { scale: 1.12, duration: 20, ease: "none" }, 0);
      tl.fromTo("#tag", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 0.3);

      tl.fromTo("#title", { opacity: 0, scale: 1.4, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 0.5);
      tl.fromTo("#artist", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 0.9);
      tl.to(["#title", "#artist"], { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 4.3);

      tl.fromTo("#en1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 4.8);
      tl.fromTo("#pt1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 5.3);
      tl.to(["#en1", "#pt1"], { opacity: 0, duration: 0.25, ease: "power2.in" }, 9.85);
      tl.set(["#en1", "#pt1"], { opacity: 0, visibility: "hidden" }, 10.1);

      tl.fromTo("#en2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 10.2);
      tl.fromTo("#pt2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 10.7);
      tl.to(["#en2", "#pt2"], { opacity: 0, duration: 0.25, ease: "power2.in" }, 15.25);
      tl.set(["#en2", "#pt2"], { opacity: 0, visibility: "hidden" }, 15.5);

      tl.fromTo("#cta", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, 15.8);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
